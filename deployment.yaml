apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab3-deployment
  labels:
    app: devops-lab3-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab3-app
  template:
    metadata:
      labels:
        app: devops-lab3-app
    spec:
      containers:
      - name: devops-lab3-app
        image: 351387070227.dkr.ecr.ap-south-1.amazonaws.com/devops-lab3-app:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 1
        envFrom:
        - configMapRef:
            name: lab3-config
        - secretRef:
            name: lab3-secret